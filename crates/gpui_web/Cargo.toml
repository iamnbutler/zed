[package]
name = "gpui_web"
version = "0.1.0"
edition.workspace = true
authors = ["Zed Team"]
description = "Web platform implementation for GPUI"
repository = "https://github.com/zed-industries/zed"
license = "Apache-2.0"

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Core async support for web
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures = "0.3"

# Browser APIs
web-sys = { version = "0.3", features = [
    "console",
    "Document", 
    "Element",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "WebGl2RenderingContext",
    "Window",
    "Performance",
    "Navigator",
    "Worker",
    "MessageEvent",
    "MessagePort",
    "DedicatedWorkerGlobalScope",
    "RequestInit",
    "RequestMode",
    "Response",
    "Headers",
] }
js-sys = "0.3"

# Workspace dependencies that are web-compatible
collections.workspace = true

# Serialization for worker communication
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
postcard = { version = "1.0", features = ["alloc"] }

# Logging and debugging
log.workspace = true
console_error_panic_hook = "0.1"
console_log = "1.0"

# Time handling
instant = { version = "0.1", features = ["wasm-bindgen"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[[example]]
name = "executor_demo"
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true